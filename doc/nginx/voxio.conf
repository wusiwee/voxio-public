# ------------------------------------------------------------ 端口与安全组
# 对外只需 80/443。10096（HTTP）、10097（WebSocket）、10098（原生客户端 TCP）都应只监听 127.0.0.1
# 或由安全组只放行本机/客服网段；10098 是自定义长度前缀协议，不是 HTTP，不经 nginx，
# 只有自写原生客户端时才需要，公网一律不要开放。

# ============================================================
# Voxio 在线客服系统 · nginx 站点配置样例
# ============================================================
# 一台服务器一个域名即可跑通全部三个面：
#   https://kf.example.com/            访客网页端（voxio-cs-user-ui 产物 dist/，站点根路径）
#   https://kf.example.com/admin/      管理后台（voxio-ui 产物 dist/，构建 base=/admin/）
#   https://kf.example.com/customer/   Java 后端接口（反向代理到 127.0.0.1:10096）
#   wss://kf.example.com/customer-ws   Netty 聊天网关 WebSocket（反向代理到 127.0.0.1:10097/ws）
#   https://kf.example.com/customer/profile/  上传目录静态文件（nginx 直接读盘，不进 JVM）
#
# 前缀约定：/customer 既是 nginx 的代理前缀，也是后端的 server.servlet.context-path，
# 因此这里 **不做 rewrite、不剥前缀**，前后端路径一一对应，换端口只改一处。
# 两个前端产物里的接口 baseURL 固定为 /customer、网关前缀固定为 /customer-ws，
# 代码里不出现任何主机名与端口，因此换机器不需要重新打包前端。
#
# 静态站点的资源前缀由 vite 的 base 决定（管理后台 /admin/、访客端 /），
# 必须与下面的 location 一一对应；对不上的典型症状是整页白屏，
# 或 index.html 拿得到、js/css 全 404。
#
# 用法：
#   cp doc/nginx/voxio.conf /etc/nginx/conf.d/voxio.conf
#   把 server_name / root / alias / 证书路径替换成实际值（证书目录先 chmod 700）
#   nginx -t && nginx -s reload
# 只有 HTTP（内网测试）时：注释掉下面 listen 443 的 server 块与 listen 80 的跳转块，
# 启用文件末尾的「纯 80 端口变体」，前端代码不用改。

upstream voxio_backend {
    server 127.0.0.1:10096;             # Spring Boot（voxio-admin.jar），端口取自 jar 内 application.yml
    keepalive 32;
}

# ------------------------------------------------------------ HTTPS 主站
server {
    listen 443 ssl;
    http2 on;                           # nginx >= 1.25；旧版本改写 listen 443 ssl http2
    server_name kf.example.com;

    ssl_certificate     /etc/nginx/tls/kf.example.com.pem;    # 必须是 fullchain：leaf + intermediate，顺序不能反，根证书不要放进来
    ssl_certificate_key /etc/nginx/tls/kf.example.com.key;
    # 证书链准备（聊天网关的 wss 与访客端都依赖这条链完整）：
    #   cat leaf.crt intermediate.crt > /etc/nginx/tls/kf.example.com.pem
    #   chmod 600 /etc/nginx/tls/*.key
    #   openssl verify -CAfile root.crt -untrusted intermediate.crt leaf.crt      # 先离线验链
    #   openssl s_client -connect kf.example.com:443 -servername kf.example.com -showcerts </dev/null   # 再验 nginx 实际发出去的链
    # 内网自签（还没有 CA 链）时：
    #   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
    #     -keyout /etc/nginx/tls/kf.example.com.key -out /etc/nginx/tls/kf.example.com.pem \
    #     -subj "/CN=kf.example.com"
    # 自签时浏览器提示不受信任，但 https/wss 链路可用；此时 **HSTS 必须保持注释**：
    # 证书不受信任就下发 HSTS，浏览器会在一段时间内锁死该域名，比不开更难处理。
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # 有 CA 证书时启用 OCSP 装订（自签证书请保持注释）
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 1.1.1.1 valid=300s;

    root  /opt/voxio/web/visitor;       # 访客网页端产物（站点根路径）
    index index.html;
    client_max_body_size 20m;           # 与 jar 内 spring.servlet.multipart.max-request-size 对齐

    # HSTS：证书链验证完整之后再打开，max-age 一年 + 覆盖子域
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/voxio.access.log;
    error_log  /var/log/nginx/voxio.error.log warn;

    gzip on;
    gzip_min_length 2k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ================= 后端接口 / 上传目录 / 聊天网关 =================

    # ---- 上传目录：nginx 直接读盘，不占 JVM 线程 ----
    # 后端返回的相对路径是 /profile/**，前端拼上 /customer 前缀后落到这里；
    # alias 会把 location 前缀整段替换掉：/customer/profile/upload/a.png -> /opt/voxio/uploadPath/upload/a.png
    # 这里只服务管理后台的头像与导入/导出临时文件（聊天消息只有文本，没有附件通道）。
    location /customer/profile/ {
        alias /opt/voxio/uploadPath/;   # 必须与激活 profile 里的 voxio.profile 是同一目录
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- 业务接口：两个前端 baseURL 统一为 /customer ----
    location /customer/ {
        proxy_pass http://voxio_backend;    # 末尾不写斜杠 = 保留 /customer 前缀原样透传
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 后端用 IpUtils.getIpAddr() 记录访客来源 IP 并做限流，必须透传真实 IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;            # 工单导出等长请求
        proxy_send_timeout 120s;
        proxy_buffering off;                # 便于流式响应与排障，普通 JSON 影响可忽略
    }

    # ---- Netty 聊天网关 WebSocket：浏览器只连同源前缀，由这里映射到网关 ----
    location /customer-ws {
        proxy_pass http://127.0.0.1:10097/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout  300s;           # 必须大于网关 kf.gateway.reader-idle-seconds=90 与客户端 25s 心跳
        proxy_send_timeout  300s;
    }

    # ================= 静态站点 =================

    location ^~ /assets/ {                  # 访客端产物目录（base=/，资源为 /assets/*）
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---- 管理后台：挂在 /admin/ 子路径，构建 base 也是 /admin/ ----
    location = /admin { return 301 /admin/; }
    location = /admin/index.html {
        alias /opt/voxio/web/admin/index.html;
        add_header Cache-Control "no-cache";
    }
    location ^~ /admin/static/ {            # 管理后台产物目录（static/js、static/css…）
        alias /opt/voxio/web/admin/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    location /admin/ {
        alias /opt/voxio/web/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 访客网页端：单页应用路由回退（根路径）----
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /favicon.ico { log_not_found off; access_log off; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------ HTTP 跳转 HTTPS
server {
    listen 80;
    server_name kf.example.com;
    return 301 https://$host$request_uri;
}


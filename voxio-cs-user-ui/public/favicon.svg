<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="VOXIO">
  <!--
    站点图标：同一构成的加粗光学版。
    16px 下「两节点 + 斜杠」是唯一还能分辨的信息量，所以这里不删部件（删了就认不出是同一品牌），
    而是把斜杠加粗：节点边长占画布的比例两版相同（84/256 = 10.5/32 = 32.8%），
    但斜杠垂直厚度相对节点边长从 56.6/84 = 0.67 提到 8.49/10.5 = 0.81，让三块之间不互相糊掉。
  -->
  <path fill="#1D1D1F" d="M2.5 2.5 L13 2.5 L13 13 L2.5 13 Z"/>
  <path fill="#1D1D1F" d="M19 19 L29.5 19 L29.5 29.5 L19 29.5 Z"/>
  <path fill="#1D1D1F" d="M13 7 L25 19 L19 25 L7 13 Z"/>
</svg>

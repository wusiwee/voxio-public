<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VOXIO">
  <!--
    VOXIO 主标记「声桥」（单色黑）。三块实心几何：两个等大方形节点 + 一条 45° 斜杠。
    两个节点是对等的两端（访客 / 客服），斜杠是它们之间唯一的那条通道；
    整个构成绕画布中心 180° 旋转对称 —— 这个对称性是有意的：它把轮廓从「箭头 / 对勾 / V」
    的读法里拉出来，只剩「双向、对等、抵达」。
    只用直线段（path 仅 M/L/Z），无曲线、无渐变、无描边，可单色、16px 可用。
    近似性核查见 brand-guide.md 第 9 节：本构成刻意避开「嵌套 V / 向下双箭头」（Vue.js）、
    三角（Vercel）、条纹（Stripe）、圆环与声波类标识。
  -->
  <path fill="#1D1D1F" d="M20 20 L104 20 L104 104 L20 104 Z"/>
  <path fill="#1D1D1F" d="M152 152 L236 152 L236 236 L152 236 Z"/>
  <path fill="#1D1D1F" d="M104 64 L192 152 L152 192 L64 104 Z"/>
</svg>
